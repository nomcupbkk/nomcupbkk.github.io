<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Nomcup</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nomcup">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#B72B34">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  /* แถบสถานะด้านบน = สีหัวแอพ · แถบปุ่มโฮมด้านล่าง = สีขาวเดียวกับเมนูล่างของแอพ */
  html,body{margin:0;height:100%;background:#FFFFFF;overflow:hidden}
  .top{position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top);background:#B72B34;z-index:2}
  /* กรอบแอพยาวถึงขอบจอล่าง (เปิดจากหน้าโฮมจะส่ง ?pwa=1 ให้แอพเว้นที่แถบปุ่มโฮมใต้เมนูล่างเอง) */
  .frame{position:fixed;left:0;right:0;top:env(safe-area-inset-top);bottom:0}
  iframe{display:block;width:100%;height:100%;border:0;background:#B72B34}
  .load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
        background:#B72B34;color:#fff;font:600 16px -apple-system,system-ui,sans-serif;z-index:-1}
  .load img{width:96px;height:96px;border-radius:22px}
</style>
</head>
<body>
<div class="top"></div>
<div class="load"><img src="icon-192.png" alt=""><span>กำลังเปิด Nomcup…</span></div>
<!-- ลิงก์เว็บแอปจาก Apps Script (การทำให้ใช้งานได้ → จัดการ → URL ของเว็บแอป) -->
<div class="frame"><iframe id="app" title="Nomcup หลังบ้าน" allow="clipboard-write"></iframe></div>
<script>
  // เปิดจากไอคอนหน้าโฮม → ?pwa=1 ให้แอพเว้นที่แถบปุ่มโฮมใต้เมนูล่าง · เปิดใน Safari ปกติไม่ต้องเว้น
  var pwa = navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  document.getElementById('app').src = 'https://script.google.com/macros/s/AKfycbwLyB6jaWWfrLiScQH5N7ombTO_yF3XE8EM80n27sWN5F_ionI8m1dbTtXo6QVRa9OC/exec' + (pwa ? '?pwa=1' : '');
</script>
</body>
</html>
