<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Nomcup</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nomcup">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#B72B34">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  /* แถบสถานะด้านบน = สีหัวแอพ · แถบปุ่มโฮมด้านล่าง = สีขาวเดียวกับเมนูล่างของแอพ */
  html,body{margin:0;height:100%;background:#FFFFFF;overflow:hidden}
  .top{position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top);background:#B72B34;z-index:2}
  .bot{position:fixed;left:0;right:0;bottom:0;height:env(safe-area-inset-bottom);background:#FFFFFF;z-index:2}
  /* กรอบแอพอยู่ระหว่างแถบสถานะกับแถบปุ่มโฮมพอดี: div ยืดตาม top/bottom แล้ว iframe เต็ม div */
  .frame{position:fixed;left:0;right:0;top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom)}
  iframe{display:block;width:100%;height:100%;border:0;background:#B72B34}
  .load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
        background:#B72B34;color:#fff;font:600 16px -apple-system,system-ui,sans-serif;z-index:-1}
  .load img{width:96px;height:96px;border-radius:22px}
</style>
</head>
<body>
<div class="top"></div><div class="bot"></div>
<div class="load"><img src="icon-192.png" alt=""><span>กำลังเปิด Nomcup…</span></div>
<!-- ลิงก์เว็บแอปจาก Apps Script (การทำให้ใช้งานได้ → จัดการ → URL ของเว็บแอป) -->
<div class="frame"><iframe src="https://script.google.com/macros/s/AKfycbwLyB6jaWWfrLiScQH5N7ombTO_yF3XE8EM80n27sWN5F_ionI8m1dbTtXo6QVRa9OC/exec"
        title="Nomcup หลังบ้าน" allow="clipboard-write"></iframe></div>
<script>
/* จำการเข้าสู่ระบบของแอพไว้ที่หน้านี้ (iPhone ล้างที่เก็บของกรอบแอพที่ซ้อนอยู่ข้างในบ่อย ทำให้ต้องใส่ PIN ใหม่)
 * แอพในกรอบส่ง setToken / clearToken มาเก็บ และถาม getToken ตอนเปิดถ้าในกรอบไม่มี */
(function () {
  var KEY = 'nomcup_token';
  var okOrigin = function (o) { return /^https:\/\/[\w-]+(-script)?\.googleusercontent\.com$/.test(o) || o === 'https://script.google.com'; };
  var get = function () { try { return localStorage.getItem(KEY); } catch (e) { return null; } };
  var put = function (v) { try { if (v) localStorage.setItem(KEY, v); else localStorage.removeItem(KEY); } catch (e) {} };
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!okOrigin(e.origin) || !d || typeof d !== 'object') return;
    if (d.nomcup === 'setToken' && typeof d.token === 'string' && /^[\w-]{20,60}$/.test(d.token)) put(d.token);
    else if (d.nomcup === 'clearToken') put(null);
    else if (d.nomcup === 'getToken' && e.source) e.source.postMessage({ nomcup: 'token', token: get() }, e.origin);
  });
})();
</script>
</body>
</html>
